<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="description" content="만들고, 기록하고, 다듬고 — 개발자 정훈의 기록 보관소." />

    <!-- Open Graph (SPA 하위 경로는 GitHub Pages가 이 404.html로 응답하므로,
         카카오톡 등 JS를 실행하지 않는 크롤러를 위해 index.html과 동일한 태그를 유지) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="개발자 훈스 아카이브" />
    <meta property="og:title" content="개발자 훈스 아카이브" />
    <meta property="og:description" content="만들고, 기록하고, 다듬고 — 개발자 정훈의 기록 보관소." />
    <meta property="og:image" content="https://gnslalsl12.github.io/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="개발자 훈스 아카이브" />
    <meta name="twitter:description" content="만들고, 기록하고, 다듬고 — 개발자 정훈의 기록 보관소." />
    <meta name="twitter:image" content="https://gnslalsl12.github.io/og-image.jpg" />

    <title>개발자 훈스 아카이브</title>
    <!--
      Single Page Apps for GitHub Pages
      https://github.com/rafgraph/spa-github-pages
      For a user/organization page (served from root), pathSegmentsToKeep = 0.
    -->
    <script>
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
